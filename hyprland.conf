# Minimal-but-working Hyprland config. Edit freely.
# optimization for a GUI called hyperland
monitor = , preferred, auto, 1

$terminal = kitty
$browser = firefox
$menu     = wofi -show drun
$mod      = SUPER

exec-once = noctalia
exec-once = waybar
exec-once = systemctl --user start hyprpolkitagent
exec-once = nm-applet --indicator

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland

general {
    gaps_in = 4
    gaps_out = 15
    border_size = 3
    col.active_border = rgb(89b4fa)
    col.inactive_border = rgb(313244)
    layout = dwindle

}

decoration {
    rounding = 6
    blur {
        enabled = true
        size = 5
        passes = 2
    }
}

input {
    kb_layout = us,il
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
}

input:touchpad {
    natural_scroll = true
}

# floating stats of my PC 

# Start Conky at login and also start it after a config reload if it is absent.
exec-once = conky -c /home/jonat/.config/conky/conky.conf
exec = pgrep -x conky > /dev/null || conky -c /home/jonat/.config/conky/conky.conf

# Conky must float for pinning to apply.
windowrule = no_initial_focus true, match:class ^[Cc]onky$
windowrule = float true, match:class ^[Cc]onky$
windowrule = pin true, match:class ^[Cc]onky$
windowrule = move (monitor_w-window_w-250) 100, match:class ^[Cc]onky$

bind = $mod, Return, exec, $terminal
bind = $mod, Q, killactive,
bind = $mod, M, exit,
bind = $mod, E, exec, thunar
bind = $mod , Z , exec , $browser
bind = $mod, R, exec, $menu
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen,
bind = $mod, L, exec, hyprlock
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, bracketleft, workspace, -1
bind = $mod, bracketright, workspace, +1
bind = $mod SHIFT, bracketleft, movetoworkspace, -1
bind = $mod SHIFT, bracketright, movetoworkspace, +1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute,        exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
binde = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
