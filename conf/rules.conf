# Window rules — how specific apps behave
# Run `hyprctl clients` to find an app's class.

# Conky must float for pinning to apply.
windowrule = no_initial_focus true, match:class ^[Cc]onky$
windowrule = float true, match:class ^[Cc]onky$
windowrule = pin true, match:class ^[Cc]onky$
windowrule = move (monitor_w-window_w-250) 100, match:class ^[Cc]onky$
